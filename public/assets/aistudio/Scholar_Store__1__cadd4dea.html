<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholar Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0C0C0C;color:#D7E2EA;font-family:'Kanit',sans-serif}
main{overflow-x:clip;padding:0 16px 80px;position:relative}
main::before{content:"";position:absolute;top:0;left:50%;width:min(100vw,800px);height:600px;transform:translateX(-50%);background:radial-gradient(circle at 50% 0,rgba(29,107,255,.25),transparent 65%);pointer-events:none}
.hero-heading{background:linear-gradient(180deg,#646973 0%,#BBCCD7 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.025em}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 4px;max-width:72rem;margin:0 auto;background:rgba(12,12,12,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header .brand{font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;border:2px solid #D7E2EA;border-radius:999px;padding:5px 14px 5px 8px;font-weight:600;font-size:.9rem}
.pill svg{width:22px;height:22px}
h1{text-align:center;font-size:clamp(3.5rem,16vw,170px);margin-top:32px;position:relative}
.sub{text-align:center;font-weight:300;text-transform:uppercase;letter-spacing:.15em;opacity:.7;font-size:clamp(.75rem,1.4vw,1rem);margin:10px 0 56px;position:relative}
section{max-width:72rem;margin:0 auto 64px}
.sh{display:flex;align-items:baseline;gap:16px;margin-bottom:20px;border-bottom:1px solid rgba(215,226,234,.2);padding-bottom:14px}
.sh .n{font-size:clamp(2.5rem,8vw,90px)}
.sh h2{font-weight:500;text-transform:uppercase;font-size:clamp(1rem,2.4vw,1.8rem);letter-spacing:.03em}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:0 32px 100px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border:2px solid #D7E2EA;border-radius:40px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;background:#0C0C0C;transition:border-color .3s,transform .3s,box-shadow .3s}
.card:hover{border-color:#4FA3FF;transform:translateY(-4px);box-shadow:0 0 40px rgba(29,107,255,.25)}
.tile{height:130px;border-radius:28px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(29,107,255,.45),#06224d 55%,#010B1F)}
.tile svg{width:86px;height:86px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.tag{position:absolute;top:30px;right:30px;border-radius:999px;padding:3px 12px;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;background:#D7E2EA;color:#0C0C0C}
.tag.hot{background:linear-gradient(123deg,#0057E7,#4FA3FF);color:#fff}
.card h3{font-weight:700;text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em}
.card p{font-weight:300;line-height:1.55;font-size:.9rem;opacity:.75;flex:1}
.buy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.price{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.5rem}
.price svg{width:26px;height:26px}
.btn{border-radius:999px;color:#fff;font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:10px 26px;font-size:.78rem;background:linear-gradient(123deg,#010B1F 7%,#0057E7 37%,#1D6BFF 72%,#4FA3FF 100%);box-shadow:0 4px 4px rgba(1,87,231,.25),4px 4px 12px #2170F1 inset;outline:2px solid #fff;outline-offset:-3px;border:0;cursor:pointer;font-family:inherit;transition:transform .2s,opacity .2s}
.btn:hover:not(:disabled){transform:scale(1.05)}
.btn:disabled{opacity:.45;cursor:default;filter:grayscale(.6)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:#fff;color:#0C0C0C;border-radius:999px;padding:12px 24px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;transition:.4s cubic-bezier(.25,.1,.25,1);z-index:50;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
.bump{animation:b .4s ease}@keyframes b{50%{transform:scale(1.15)}}
.fade{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.25,.1,.25,1),transform .7s cubic-bezier(.25,.1,.25,1)}
.fade.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.fade{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DBDFF"/><stop offset="1" stop-color="#0057E7"/></linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#8fa3b5"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16327a"/><stop offset="1" stop-color="#010B1F"/></linearGradient>
</defs></svg>
<main>
<header><span class="brand">Scholar Store</span><div class="pills"><div class="pill" id="xp"></div><div class="pill" id="bal"></div></div></header>
<h1 class="hero-heading fade">Store</h1>
<p class="sub fade">Spend gems · power up your learning</p>
<div id="shop"></div>
</main>
<div id="toast"></div>
<script>
(function(){
var S='stroke="#D7E2EA" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
var svg=function(b){return '<svg viewBox="0 0 64 64" fill="none">'+b+'</svg>'};
function stone(inner,big){return svg('<path d="M32 4 50 18 45 58H19L14 18Z" fill="url(#gb)" '+S+'/><path d="M14 18h36" stroke="#fff" stroke-opacity=".4"/>'+(big?'<path d="M7 32 14 22v26ZM57 32 50 22v26Z" fill="url(#gs)" '+S+'/>':'')+'<circle cx="32" cy="36" r="12" fill="#010B1F" '+S+'/>'+inner)}
function chest(lid,extra){return svg(extra+'<rect x="8" y="34" width="48" height="24" rx="4" fill="url(#gd)" '+S+'/><path d="M8 34v-6a24 14 0 0 1 48 0v6z" fill="url(#'+lid+')" '+S+'/><path d="M22 16v42M42 16v42" stroke="#D7E2EA" stroke-width="3"/><rect x="27" y="31" width="10" height="12" rx="2" fill="url(#gs)" '+S+'/>')}
var I={
gem:svg('<path d="M32 8 52 24 32 56 12 24Z" fill="url(#gb)" '+S+'/><path d="M12 24h40M24 24l8-16 8 16-8 32zM24 24 32 56 40 24" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>'),
card:svg('<rect x="5" y="12" width="54" height="36" rx="8" fill="url(#gd)" '+S+'/><circle cx="19" cy="27" r="6" fill="url(#gb)"/><path d="M9 42c2-8 14-8 20 0z" fill="url(#gb)"/><path d="M36 24h16M36 32h8" '+S+'/><path d="M38 52l14-14 5 5-14 14-7 2z" fill="url(#gs)" '+S+'/>'),
s1:stone('<path d="M32 29v7l5 3" '+S+'/>'),
s3:stone('<path d="M32 29v7l5 3" '+S+'/><circle cx="32" cy="36" r="18" stroke="#fff" stroke-dasharray="3 4" opacity=".8"/>'),
s24:stone('<path d="M26 30l12 12M38 30 26 42M32 28v16" '+S+'/>',1),
flask:svg('<path d="M26 6h12v5h-2v12l14 23a6 6 0 0 1-5 10H19a6 6 0 0 1-5-10l14-23V11h-2z" fill="url(#gs)" fill-opacity=".25" '+S+'/><path d="M20 40h24l6 8a4 4 0 0 1-3.500 6h-29A4 4 0 0 1 14 48z" fill="url(#gb)"/><path d="M34 29l-7 10h5l-3 9 9-12h-5z" fill="#fff"/><circle cx="40" cy="44" r="2" fill="#fff" opacity=".7"/>'),
elixir:svg('<rect x="25" y="3" width="14" height="8" rx="2" fill="url(#gs)" '+S+'/><path d="M28 11h8v8c9 3 14 10 14 20 0 10-8 17-18 17S14 49 14 39c0-10 5-17 14-20z" fill="url(#gd)" '+S+'/><path d="M15 38c1 10 8 16 17 16s16-6 17-16c-9-4-25-4-34 0z" fill="url(#gb)"/><path d="m32 30 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#fff"/>'),
shield:svg('<path d="M32 4 53 12v18c0 14-9 24-21 30C20 54 11 44 11 30V12Z" fill="url(#gb)" '+S+'/><path d="M32 20c2 7 9 9 9 17a9 9 0 0 1-18 0c0-5 3-6 4-10 2 1 4 2 5 5 1-3 1-7 0-12z" fill="#fff"/>'),
c1:chest('gs',''),
c2:chest('gb','<path d="M19 14 21 3l11 7 11-7 2 11z" fill="url(#gs)" '+S+'/>'),
c3:chest('gb','<path d="M32 0l7 8-7 9-7-9z" fill="url(#gb)" '+S+'/><path d="M10 6l4 3M54 6l-4 3M6 18l5 1M58 18l-5 1" '+S+'/>'),
king:svg('<path d="M7 46 11 16l15 14 6-18 6 18 15-14 4 30z" fill="url(#gb)" '+S+'/><rect x="7" y="46" width="50" height="9" rx="3" fill="url(#gs)" '+S+'/><circle cx="11" cy="13" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/><circle cx="53" cy="13" r="3" fill="#fff"/>'),
ninja:svg('<circle cx="30" cy="34" r="22" fill="url(#gd)" '+S+'/><rect x="8" y="26" width="44" height="15" rx="6" fill="url(#gb)" '+S+'/><ellipse cx="21" cy="33" rx="5" ry="3" fill="#fff"/><ellipse cx="39" cy="33" rx="5" ry="3" fill="#fff"/><path d="M52 30l9-7M52 36l9 7" '+S+'/>'),
robot:svg('<rect x="11" y="20" width="42" height="34" rx="10" fill="url(#gd)" '+S+'/><rect x="17" y="29" width="30" height="13" rx="6.500" fill="url(#gb)"/><circle cx="26" cy="35.500" r="3" fill="#fff"/><circle cx="38" cy="35.500" r="3" fill="#fff"/><path d="M32 20v-8M26 48h12" '+S+'/><circle cx="32" cy="9" r="3.500" fill="url(#gs)"/><path d="M7 31v12M57 31v12" '+S+' stroke-width="4"/>')
};
var G=function(c){return '<span style="display:inline-flex;width:'+(c||22)+'px;height:'+(c||22)+'px">'+I.gem.replace('<svg','<svg width="100%" height="100%"')+'</span>'};
var cats=[
['Identity Passes & Cards',[['Name Change Card',50,'Consumable pass to rename your scholar display handle across courses and leaderboards.','','card']]],
['Life Stones · Unlimited Practice Lives',[['1-Hour Life Stone',50,'Grants 1 hour of continuous unlimited practice lives.','','s1'],['3-Hour Life Stone',120,'Grants 3 hours of continuous unlimited practice lives.','Best Value','s3',1],['24-Hour Rune Stone',350,'Grants a full 24 hours of unlimited practice lives.','Legendary','s24',1]]],
['XP Elixirs & Boosts',[['Arcane XP Flask',40,'Instantly adds +200 XP to your learning level.','','flask',0,200],['Grand XP Elixir',85,'Instantly adds +500 XP to your learning level.','','elixir',0,500]]],
['Streak Protection',[['Streak Shield',60,'Protects your daily learning flame streak if you miss a day.','','shield']]],
['Loot Chests',[['Silver Chest',35,'Unlocks instant loot (+60 XP & +15 gems).','','c1',0,60,15],['Royal Crown Chest',75,'Unlocks royal loot (+150 XP & +35 gems).','','c2',0,150,35],['Deluxe Chest',150,'Unlocks mythic loot (+300 XP & +70 gems).','Mythic','c3',1,300,70]]],
['Mascot Avatar Skins',[['Algorithmic King',250,'A regal mascot skin fit for the ruler of all algorithms.','Royal Skin','king',0,0,0,1],['Cyber Ninja',200,'Stealth cyberpunk mascot skin that strikes from the shadows.','Stealth Cyberpunk','ninja',0,0,0,1],['Silicon Titan',220,'Futuristic AI robot mascot skin built from pure silicon.','Futuristic AI Robot','robot',0,0,0,1]]]
];
var bal=600,xp=0,owned={};
var shop=document.getElementById('shop'),t=document.getElementById('toast'),tm;
shop.innerHTML=cats.map(function(c,ci){return '<section class="fade"><div class="sh"><span class="n hero-heading">0'+(ci+1)+'</span><h2>'+c[0]+'</h2></div><div class="grid">'+c[1].map(function(p,pi){var id=ci+'-'+pi;return '<div class="card"><div class="tile">'+I[p[4]]+'</div>'+(p[3]?'<span class="tag'+(p[5]?' hot':'')+'">'+p[3]+'</span>':'')+'<h3>'+p[0]+'</h3><p>'+p[2]+'</p><div class="buy"><div class="price">'+G(26)+p[1]+'</div><button class="btn" data-id="'+id+'">Buy</button></div></div>'}).join('')+'</div></section>'}).join('');
function head(b){document.getElementById('bal').innerHTML=G(22)+'<span>'+bal+'</span>';document.getElementById('xp').innerHTML='<span style="font-size:.7rem;letter-spacing:.1em;opacity:.7;padding-left:6px">XP</span><span>'+xp+'</span>';if(b)document.getElementById('bal').classList.add('bump');setTimeout(function(){document.getElementById('bal').classList.remove('bump')},400)}
function toast(m){t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){t.classList.remove('on')},2400)}
function refresh(){[].forEach.call(document.querySelectorAll('.btn'),function(b){var id=b.dataset.id.split('-'),p=cats[id[0]][1][id[1]];if(owned[b.dataset.id]){b.textContent='Owned';b.disabled=true}else b.disabled=p[1]>bal&&false})}
shop.addEventListener('click',function(e){var b=e.target.closest('.btn');if(!b||b.disabled)return;var id=b.dataset.id.split('-'),p=cats[id[0]][1][id[1]];
 if(p[1]>bal){toast('Not enough gems');return}
 bal-=p[1];if(p[6])xp+=p[6];if(p[7])bal+=p[7];if(p[8])owned[b.dataset.id]=1;
 toast(p[8]?p[0]+' unlocked':p[7]?p[0]+' opened · +'+p[6]+' XP · +'+p[7]+' gems':p[6]?'+'+p[6]+' XP added':p[0]+' purchased');
 head(1);refresh()});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'50px'});
document.querySelectorAll('.fade').forEach(function(el){io.observe(el)});
head();
})();
</script>
</body>
</html>
