<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quests & Achievements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--fg:#D7E2EA;--b1:#4FA3FF;--b2:#1D6BFF;--b3:#0057E7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0C0C0C;color:var(--fg);font-family:'Kanit',sans-serif}
button{font-family:inherit;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:28px 20px 80px;position:relative;overflow-x:clip}
main::before{content:"";position:absolute;top:0;left:50%;width:min(100vw,640px);height:520px;transform:translateX(-50%);background:radial-gradient(circle at 50% 0,rgba(29,107,255,.2),transparent 65%);pointer-events:none}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid rgba(215,226,234,.15);position:relative}
.hero-heading{background:linear-gradient(180deg,#646973 0%,#BBCCD7 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.025em}
h1{font-size:clamp(1.7rem,7vw,2.6rem)}
.reset{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:300;font-size:.95rem;opacity:.7}
.gems{display:flex;align-items:center;gap:8px;border:2px solid var(--fg);border-radius:999px;padding:8px 18px;font-weight:600;font-size:1.3rem;color:var(--b1);white-space:nowrap;transition:transform .3s}
.gems.bump{transform:scale(1.12)}
svg.i{width:1em;height:1em;flex:none}
.big{margin-top:28px;border:2px solid var(--fg);border-radius:40px;padding:22px;background:linear-gradient(160deg,#06122e,#0C0C0C 60%);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{border:2px solid var(--b3);background:rgba(0,87,231,.18);color:var(--b1);border-radius:999px;padding:6px 18px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.85rem}
.ev{font-weight:500;color:var(--b1);display:flex;gap:6px;align-items:center}
.big h2{font-size:clamp(2rem,9vw,3rem);margin:18px 0 6px;font-weight:900;text-transform:uppercase;line-height:1}
.left{display:flex;gap:8px;align-items:center;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
.pbox{margin-top:20px;border:1px solid rgba(215,226,234,.18);border-radius:28px;padding:18px 20px;background:rgba(0,0,0,.35)}
.prow{display:flex;justify-content:space-between;font-weight:500;font-size:1.1rem;margin-bottom:12px}
.prow span:last-child{color:var(--b1);font-weight:600}
.bar{height:26px;border-radius:999px;background:#17181d;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,#0057E7,#4FA3FF);transition:width .8s cubic-bezier(.25,.1,.25,1);box-shadow:0 0 16px rgba(79,163,255,.5)}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-weight:500;letter-spacing:.2em;font-size:.8rem;text-shadow:0 1px 3px #000}
.tabs{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid rgba(215,226,234,.25);border-radius:999px;padding:6px}
.tab{border:2px solid transparent;border-radius:999px;background:none;color:var(--fg);padding:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.95rem;opacity:.6;display:flex;gap:8px;align-items:center;justify-content:center;transition:.2s}
.tab.on{opacity:1;background:linear-gradient(123deg,#010B1F 7%,#0057E7 37%,#1D6BFF 72%,#4FA3FF 100%);box-shadow:0 4px 4px rgba(1,87,231,.25),4px 4px 12px #2170F1 inset;border-color:#fff;color:#fff}
#list{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.q{display:flex;align-items:center;gap:16px;border:2px solid rgba(215,226,234,.28);border-radius:40px;padding:20px;background:#0C0C0C;opacity:0;transform:translateY(30px);animation:in .7s cubic-bezier(.25,.1,.25,1) forwards;animation-delay:var(--d,0s);transition:border-color .3s}
.q.ready{border-color:var(--b1);box-shadow:0 0 30px rgba(29,107,255,.25)}
.q.done{animation-name:in2}
@keyframes in{to{opacity:1;transform:none}}
@keyframes in2{to{opacity:.6;transform:none}}
.ico{position:relative;width:76px;height:76px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(29,107,255,.25),transparent 70%)}
.ico svg{width:64px;height:64px}
.ck{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--b3);border:3px solid #0C0C0C;display:grid;place-items:center}
.ck svg{width:14px;height:14px}
.info{flex:1;min-width:0}
.info h3{font-weight:600;font-size:1.1rem;line-height:1.2}
.info p{font-weight:300;opacity:.6;font-size:.88rem;margin:4px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:10px;align-items:center;font-weight:300;font-size:.85rem}
.mini .bar{height:8px;flex:1;background:#17181d}
.mini .bar i{box-shadow:none;width:var(--w)}
.act{flex:none;min-width:104px;border-radius:999px;border:2px solid var(--fg);background:none;color:var(--fg);padding:11px 16px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;transition:background .2s}
.act:hover:not(:disabled){background:rgba(215,226,234,.1)}
.act.claim{color:#fff;border-color:#fff;background:linear-gradient(123deg,#010B1F 7%,#0057E7 37%,#1D6BFF 72%,#4FA3FF 100%);box-shadow:0 4px 4px rgba(1,87,231,.25),4px 4px 12px #2170F1 inset}
.act.cl{border-color:var(--b3);color:var(--b1);background:rgba(0,87,231,.15);cursor:default}
.rw{display:flex;justify-content:center;align-items:center;gap:4px;font-size:.78rem;font-weight:500;letter-spacing:.06em;color:var(--b1);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#fff;color:#0C0C0C;border-radius:999px;padding:12px 26px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;transition:transform .4s cubic-bezier(.25,.1,.25,1);z-index:9;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
@media(max-width:440px){.q{padding:16px;gap:12px}.ico{width:60px;height:60px}.ico svg{width:50px;height:50px}.act{min-width:88px;padding:10px 12px;font-size:.78rem}.big{padding:18px}}
@media(prefers-reduced-motion:reduce){.q{animation:none;opacity:1;transform:none}.q.done{opacity:.6}.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 class="hero-heading">Quests &amp; Achievements</h1>
      <div class="reset"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="rst">Resets in …</span></div></div>
    <div class="gems" id="gems"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4FA3FF"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="#010B1F" stroke-width="1.2"/></svg><span id="gn">310</span></div>
  </header>

  <section class="big">
    <div class="top"><span class="tag">Monthly Track</span><span class="ev"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 1 1 2 2 2 1-2 1-5 1-8z"/></svg>Monthly Event</span></div>
    <h2 class="hero-heading" id="mname">Quest</h2>
    <div class="left"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="mleft"></span></div>
    <div class="pbox"><div class="prow"><span>20 Quest Points</span><span id="togo"></span></div>
      <div class="bar"><i id="mbar"></i><b id="mtxt"></b></div></div>
  </section>

  <div class="tabs"><button class="tab on" data-t="daily"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-3-5-7-2-4 0M12 8c3-5 7-2 4 0"/></svg>Daily Tasks</button><button class="tab" data-t="life"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="6"/><path d="M8 14l-2 8 6-3 6 3-2-8"/></svg>Lifetime</button></div>
  <div id="list"></div>
</main>
<div class="toast" id="toast"></div>

<script>
(function(){
  var gems=310,qp=11,tab='daily';
  var data={
    daily:[
      {t:'Complete 2 Learning Lessons',d:'Finish any 2 guided interactive levels of your choice.',p:1,g:2,r:10},
      {t:'Score 90%+ in a Quiz Drill',d:'Show exceptional accuracy in any practice quiz.',p:1,g:1,r:15,claimed:true},
      {t:'Review 10 Flashcards',d:'Keep your memory sharp with a quick review round.',p:4,g:10,r:10},
      {t:'Study for 20 Minutes',d:'Spend focused time learning in any course today.',p:12,g:20,r:20},
      {t:'Share Your Progress',d:'Send a progress card to a friend or on social.',p:0,g:1,r:5}
    ],
    life:[
      {t:'Complete 50 Lessons',d:'Reach the 50 lesson milestone across all courses.',p:38,g:50,r:100},
      {t:'7 Day Streak',d:'Study seven days in a row without missing one.',p:7,g:7,r:50},
      {t:'Perfect Score Master',d:'Earn 100% on ten different quiz drills.',p:3,g:10,r:75},
      {t:'Collect 1000 Gems',d:'Grow your gem collection to one thousand.',p:310,g:1000,r:200}
    ]
  };
  var gem='<svg class="i" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4FA3FF"/></svg>';
  var chk='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M4 12l5 5L20 6"/></svg>';
  function chest(open){var a=open?'#8fc4ff':'#1D6BFF',b=open?'#3b82f6':'#0a2a66';
    return '<svg viewBox="0 0 64 64"><ellipse cx="32" cy="58" rx="22" ry="3" fill="#000" opacity=".4"/><rect x="8" y="28" width="48" height="28" rx="5" fill="'+b+'" stroke="#D7E2EA" stroke-width="2"/>'+(open?'<path d="M8 28 L14 10 H50 L56 28Z" fill="'+a+'" stroke="#D7E2EA" stroke-width="2"/><ellipse cx="32" cy="28" rx="20" ry="4" fill="#BBCCD7"/>':'<path d="M8 28a24 18 0 0 1 48 0z" fill="'+a+'" stroke="#D7E2EA" stroke-width="2"/>')+'<rect x="14" y="26" width="6" height="30" fill="#4FA3FF" opacity=".8"/><rect x="44" y="26" width="6" height="30" fill="#4FA3FF" opacity=".8"/><rect x="27" y="30" width="10" height="12" rx="2" fill="#D7E2EA"/><circle cx="32" cy="35" r="2" fill="#0057E7"/></svg>'}
  var list=document.getElementById('list');
  function render(){
    list.innerHTML=data[tab].map(function(q,i){
      var done=q.p>=q.g,pct=Math.min(100,q.p/q.g*100);
      var btn=q.claimed?'<button class="act cl" disabled>'+chk+' Claimed</button>':done?'<button class="act claim" data-i="'+i+'">Claim</button>':'<button class="act" data-i="'+i+'">Start</button>';
      return '<div class="q'+(done&&!q.claimed?' ready':'')+(q.claimed?' done':'')+'" style="--d:'+i*.08+'s"><div class="ico">'+chest(q.claimed)+(q.claimed?'<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>':'')+'</div><div class="info"><h3>'+q.t+'</h3><p>'+q.d+'</p><div class="mini"><div class="bar"><i style="--w:'+pct+'%;width:'+pct+'%"></i></div><span>'+Math.min(q.p,q.g)+'/'+q.g+'</span></div></div><div>'+btn+'<span class="rw">+'+q.r+' '+gem+'</span></div></div>'}).join('');
  }
  function mon(){
    var now=new Date(),end=new Date(now.getFullYear(),now.getMonth()+1,1),d=Math.ceil((end-now)/864e5);
    document.getElementById('mname').textContent=now.toLocaleString('en',{month:'long'})+' Quest';
    document.getElementById('mleft').textContent=d+'d left';
    document.getElementById('togo').textContent=Math.max(0,20-qp)+' to go';
    document.getElementById('mtxt').textContent=qp+' / 20';
    document.getElementById('mbar').style.width=Math.min(100,qp/20*100)+'%';
  }
  function tick(){var n=new Date(),e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((e-n)/1000);
    document.getElementById('rst').textContent='Resets in '+Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m '+s%60+'s'}
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},2200)}
  list.addEventListener('click',function(e){
    var b=e.target.closest('.act');if(!b||b.disabled)return;var q=data[tab][+b.dataset.i];
    if(q.p>=q.g){q.claimed=true;gems+=q.r;qp=Math.min(20,qp+1);document.getElementById('gn').textContent=gems;var g=document.getElementById('gems');g.classList.add('bump');setTimeout(function(){g.classList.remove('bump')},300);mon();toast('+'+q.r+' gems · +1 quest point')}
    else{q.p=Math.min(q.g,q.p+(q.g>10?Math.ceil(q.g/4):1));toast('Progress: '+q.p+'/'+q.g)}
    render();
  });
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){tab=t.dataset.t;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t)});render()})});
  render();mon();tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
