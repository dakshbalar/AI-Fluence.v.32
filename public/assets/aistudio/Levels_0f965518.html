<!DOCTYPE html>
<html lang="en" data-track="everyone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levels</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0C0C0C;--fg:#D7E2EA;--card:#121418;--line:rgba(215,226,234,.16);--mono:ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-track=genai]{--b0:#12062b;--b1:#C9A2FF;--b2:#8E4DFF;--b3:#4A1C9A;--rgb:142,77,255;--bd:#8E4DFF;--on:#fff;--h1:#5b3aa8;--h2:#C9A2FF}
[data-track=everyone]{--b0:#3a2300;--b1:#FFEBB0;--b2:#F5B02E;--b3:#B36B00;--rgb:245,176,46;--bd:#F5B02E;--on:#2a1700;--h1:#B36B00;--h2:#FFEBB0}
[data-track=everyone] .sec{background:linear-gradient(180deg,rgba(255,255,255,.45) 0,rgba(255,255,255,0) 55%),linear-gradient(135deg,#FFE08A,#F5B02E 55%,#D98A00);box-shadow:0 7px 0 #7a4700,0 0 60px rgba(245,176,46,.35),inset 3px 3px 10px rgba(255,255,255,.5),inset 0 -5px 12px rgba(122,71,0,.35)}
[data-track=everyone] .chip,[data-track=everyone] .sq{background:rgba(42,23,0,.22);border-color:rgba(42,23,0,.4)}
[data-track=everyone] .tab.on,[data-track=everyone] .fab{background:linear-gradient(135deg,#FFE08A,#F5B02E 55%,#D98A00);box-shadow:0 5px 0 #7a4700,0 0 30px rgba(245,176,46,.5),inset 3px 3px 8px rgba(255,255,255,.55)}
[data-track=everyone] .tab.on{box-shadow:0 3px 0 #7a4700,inset 3px 3px 8px rgba(255,255,255,.55)}
[data-track=everyone] .start{background:linear-gradient(135deg,#FFE08A,#F5B02E);box-shadow:0 4px 0 #000,0 0 22px rgba(245,176,46,.7)}
[data-track=dsa]{--b0:#010B1F;--b1:#4FA3FF;--b2:#1D6BFF;--b3:#0057E7;--rgb:29,107,255;--bd:#1D6BFF;--on:#fff;--h1:#646973;--h2:#BBCCD7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'Kanit',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% -5%,rgba(var(--rgb),.32),transparent 55%) no-repeat,var(--bg)}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 150px;position:relative}
.hg{background:linear-gradient(180deg,var(--h1),var(--h2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.025em}
.tabs{display:flex;gap:6px;padding:6px;border:2px solid var(--fg);border-radius:999px;background:var(--bg)}
.tab{flex:1;border:0;background:none;color:var(--fg);font:500 .85rem 'Kanit';letter-spacing:.1em;text-transform:uppercase;padding:12px;border-radius:999px;opacity:.6;display:flex;gap:8px;justify-content:center;align-items:center}
.tab.on{opacity:1;color:var(--on);background:linear-gradient(123deg,var(--b0) 7%,var(--b3) 37%,var(--b2) 72%,var(--b1) 100%);box-shadow:0 4px 4px rgba(var(--rgb),.25),4px 4px 12px var(--b2) inset}
.trk{display:flex;gap:6px;margin-top:12px}
.tk{flex:1;border:2px solid var(--line);background:var(--card);color:var(--fg);font:500 .72rem 'Kanit';letter-spacing:.06em;text-transform:uppercase;padding:10px 4px;border-radius:999px;opacity:.65;transition:.2s}
.tk.on{opacity:1;border-color:var(--bd);background:rgba(var(--rgb),.18)}
.sec{position:relative;margin-top:14px;border-radius:32px;padding:16px 16px 18px 18px;display:flex;gap:10px;align-items:center;color:var(--on);background:linear-gradient(180deg,rgba(255,255,255,.25) 0,rgba(255,255,255,0) 45%),linear-gradient(135deg,var(--b3),var(--b2) 65%,var(--b1));box-shadow:0 7px 0 var(--b0),0 0 50px rgba(var(--rgb),.3),inset 3px 3px 10px rgba(255,255,255,.3),inset 0 -4px 10px rgba(0,0,0,.2)}
.sl{flex:1;min-width:0}
.chip{display:block;max-width:100%;border:0;background:rgba(0,0,0,.3);color:inherit;font:500 .68rem 'Kanit';letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec h2{font-weight:800;font-size:1.55rem;line-height:1.1;margin-top:10px}
.sb{display:flex;gap:8px;flex:none}
.sq{width:44px;height:48px;border-radius:16px;border:2px solid rgba(0,0,0,.35);background:rgba(0,0,0,.2);color:inherit;display:grid;place-items:center}
.sq svg{width:22px;height:22px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:40;background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:6px;display:none;color:var(--fg)}
.dd.show{display:block}
.dd button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;color:var(--fg);font:500 .9rem 'Kanit';padding:12px 14px;border-radius:16px;text-align:left}
.dd button.on{background:rgba(var(--rgb),.2)}
.dd small{font:600 .6rem var(--mono);opacity:.6;letter-spacing:.08em}
.map{position:relative;margin-top:6px}
.spark{position:absolute;top:6px;width:30px;height:30px;color:var(--b1);filter:drop-shadow(0 0 8px rgba(var(--rgb),.8));animation:tw 3s ease-in-out infinite}
.moon{position:absolute;left:-14px;top:420px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#BBCCD7 40%,#4a5160);box-shadow:inset -8px -6px 14px rgba(0,0,0,.5);opacity:.4;animation:fl 6s ease-in-out infinite}
.cube{position:absolute;right:-8px;top:780px;width:50px;height:50px;border-radius:22%;background:linear-gradient(135deg,var(--b1),var(--b2) 60%,var(--b0));box-shadow:inset 4px 4px 10px rgba(255,255,255,.3);transform:rotate(18deg);opacity:.4;animation:fl 7s ease-in-out infinite}
@keyframes tw{50%{opacity:.4;transform:scale(.8) rotate(20deg)}}
@keyframes fl{50%{translate:0 -12px}}
svg.path{position:absolute;inset:0;pointer-events:none;overflow:visible}
.seg-on{filter:drop-shadow(0 0 8px rgba(var(--rgb),.6))}
.node{position:absolute;width:160px;margin-left:-80px;display:flex;flex-direction:column;align-items:center;z-index:2;opacity:0;animation:pop .6s cubic-bezier(.25,.1,.25,1) forwards;animation-delay:var(--d,0s)}
.noanim .node{animation:none;opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.start{position:absolute;top:-46px;display:flex;align-items:center;gap:6px;font:800 .85rem var(--mono);letter-spacing:.1em;color:var(--on);padding:6px 14px;border-radius:12px;background:linear-gradient(135deg,var(--b1),var(--b2));border:2px solid #0C0C0C;box-shadow:0 4px 0 #000,0 0 18px rgba(var(--rgb),.6);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.box{position:relative;width:96px;height:96px;border-radius:30px;display:grid;place-items:center;border:0;color:var(--on);transition:transform .15s}
.box:active{transform:translateY(4px)}
.box .code{position:absolute;top:9px;left:0;right:0;text-align:center;font:700 .62rem var(--mono);letter-spacing:.06em;opacity:.65}
.box .num{font-weight:900;font-size:2.6rem;line-height:1;margin-top:8px;text-shadow:0 3px 0 rgba(1,11,31,.45)}
.box.cur{background:linear-gradient(160deg,var(--b1),var(--b2) 55%,var(--b3));box-shadow:0 9px 0 var(--b0),inset 5px 5px 12px rgba(255,255,255,.4),inset -6px -6px 14px rgba(0,0,0,.3),0 0 40px rgba(var(--rgb),.65);outline:3px solid #fff;outline-offset:-6px;animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 9px 0 var(--b0),inset 5px 5px 12px rgba(255,255,255,.4),inset -6px -6px 14px rgba(0,0,0,.3),0 0 64px rgba(var(--rgb),.95)}}
.box.done{background:linear-gradient(160deg,#fff,var(--b1) 45%,var(--b2));color:#0C0C0C;box-shadow:0 9px 0 var(--b3),inset 5px 5px 12px rgba(255,255,255,.6),inset -6px -6px 14px rgba(0,0,0,.2);outline:3px solid #fff;outline-offset:-6px}
.box.done .num{text-shadow:none}
.box.lock{background:linear-gradient(160deg,#1c2230,#0c1018);box-shadow:0 9px 0 #05070b,inset 3px 3px 10px rgba(255,255,255,.08);border:2px solid #2a3344;color:#6b778c}
.box.lock svg{width:34px;height:34px;margin-top:8px}
.box.shake{animation:sh .4s}
@keyframes sh{25%{translate:-6px 0}75%{translate:6px 0}}
.stars{margin-top:20px;display:flex;gap:4px;background:#080b14;border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.stars svg{width:18px;height:18px}
.nm{margin-top:9px;max-width:160px;font:700 .78rem var(--mono);color:var(--fg);background:#05080f;border:1px solid var(--line);border-radius:99px;padding:5px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock-n{opacity:.7}
.chest{cursor:pointer;margin-top:10px;filter:drop-shadow(0 0 0 transparent);transition:.3s}
.chest.open{filter:drop-shadow(0 0 22px rgba(var(--rgb),.9))}
.lid{transition:transform .5s;transform-origin:14px 46px}
.open .lid{transform:rotate(-28deg)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;border:0;color:var(--on);padding:10px 20px 10px 14px;border-radius:26px;background:linear-gradient(123deg,var(--b0) 7%,var(--b3) 37%,var(--b2) 72%,var(--b1) 100%);box-shadow:0 5px 0 rgba(0,0,0,.5),0 0 30px rgba(var(--rgb),.5),4px 4px 12px var(--b2) inset;outline:2px solid var(--on);outline-offset:-4px;text-align:left}
.fab svg{width:30px;height:30px}
.fab small{display:block;font-size:.65rem;letter-spacing:.14em;font-weight:600;opacity:.85}
.fab b{font-size:1.1rem;font-weight:800;letter-spacing:.02em}
.theory{display:none}
.theory.show{display:block}
.theory h3{font-size:2.4rem;margin:22px 0 16px;text-align:center}
.tcard{background:#fff;color:#0C0C0C;border-radius:32px;padding:6px 22px}
.ti{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid rgba(12,12,12,.15)}
.ti:last-child{border:0}
.ti .n{font-weight:900;font-size:2.6rem;line-height:1;min-width:1.2em}
.ti h4{font-weight:500;text-transform:uppercase;font-size:1.05rem}
.ti p{font:400 .75rem var(--mono);opacity:.6;margin-top:2px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;translate:-50% -90px;z-index:60;background:#05080f;border:2px solid var(--bd);color:var(--fg);font:500 .85rem 'Kanit';letter-spacing:.06em;padding:11px 22px;border-radius:99px;transition:translate .4s cubic-bezier(.25,.1,.25,1);white-space:nowrap;box-shadow:0 0 30px rgba(var(--rgb),.4)}
.toast.show{translate:-50% 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.node{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-t="q"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>Questions</button>
    <button class="tab" data-t="t"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z"/></svg>Theory</button>
  </div>
  <div class="trk" id="trk"></div>
  <div class="sec" id="sec">
    <div class="sl"><button class="chip" id="chip"></button><h2 id="stitle"></h2></div>
    <div class="sb">
      <button class="sq" id="nx" aria-label="Next section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="sq" id="bk" aria-label="Theory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2zM22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z"/></svg></button>
    </div>
    <div class="dd" id="dd"></div>
  </div>
  <div id="qv" class="map" style="height:1240px"></div>
  <div id="tv" class="theory"></div>
</div>
<button class="fab" id="fab"><svg viewBox="0 0 32 32" fill="none"><circle cx="15" cy="17" r="12" fill="#fff" stroke="#E6392B" stroke-width="2"/><circle cx="15" cy="17" r="8" fill="#E6392B"/><circle cx="15" cy="17" r="4" fill="#fff"/><circle cx="15" cy="17" r="1.6" fill="#E6392B"/><path d="M15 17L27 5" stroke="#4FA3FF" stroke-width="2.4" stroke-linecap="round"/></svg><div><small>TASKS</small><b id="tk">0/3 DONE</b></div></button>
<div class="toast" id="toast"></div>

<script>
var TR={
genai:{n:"Generative AI",s:[
["What is Generative AI?",["Intro to GenAI","How LLMs Think","Tokens & Context","Prompting Basics","Section Quiz"]],
["Prompt Engineering",["Clear Instructions","Few-Shot Prompts","Chain of Thought","Role & Format","Prompt Lab"]],
["Building with APIs",["Calling a Model","Streaming Output","Tool Use","Structured JSON","Mini Project"]],
["RAG & Agents",["Embeddings 101","Vector Search","Build a RAG Bot","Agent Loops","Capstone"]]]},
everyone:{n:"AI for Everyone",s:[
["What is AI?",["Demystifying AI","Traditional vs AI","Machine Learning","Data & Models","Section Quiz"]],
["AI in Daily Life",["Smart Assistants","Recommendations","Vision & Speech","AI at Work","Daily Quiz"]],
["Using AI Well",["Good Prompts","Spotting Errors","Bias & Fairness","Privacy Basics","Safety Quiz"]],
["The Future of AI",["Jobs & Skills","AI Ethics","Next Big Ideas","Your AI Plan","Final Quiz"]]]},
dsa:{n:"DSA",s:[
["Arrays & Strings",["Array Basics","Two Pointers","Sliding Window","String Tricks","Array Boss"]],
["Hashing & Stacks",["Hash Maps","Frequency Count","Stacks","Queues","Monotonic Stack"]],
["Trees & Graphs",["Binary Trees","BST Ops","BFS & DFS","Shortest Path","Graph Boss"]],
["Dynamic Programming",["Recursion","Memoization","1D DP","2D DP","DP Boss"]]]}
};
var tr="everyone",sec=0,tab="q",stars={},claimed={};
var XS=[50,27,68,30,66,50],GAP=190,TOP=58;
var STAR='<svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9.5 9,9" fill="FILL" stroke="STROKE" stroke-width="1.6" stroke-linejoin="round"/></svg>';
var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
var SPARK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0z"/></svg>';
function $(i){return document.getElementById(i)}
function key(t,s){return tab+":"+t+":"+s}
function st(t,s){return stars[key(t,s)]||(stars[key(t,s)]=[])}
function unl(t,s){return s===0||st(t,s-1).length>=5}
function total(){var n=0;for(var k in stars)n+=stars[k].length;return n}
function toast(m){var e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("show")},1900)}
function lstate(i){var a=st(tr,sec);if(i<a.length)return"done";if(i===a.length&&unl(tr,sec))return"cur";return"lock"}
function renderHead(){
  var T=TR[tr];
  document.documentElement.dataset.track=tr;
  $("trk").innerHTML=Object.keys(TR).map(function(k){return '<button class="tk'+(k===tr?' on':'')+'" data-k="'+k+'">'+TR[k].n+'</button>'}).join("");
  $("chip").textContent=T.n+" · Section "+(sec+1)+" of "+T.s.length+" ⌄";
  $("stitle").textContent=T.s[sec][0];
  $("dd").innerHTML=T.s.map(function(s,i){return '<button data-i="'+i+'" class="'+(i===sec?'on':'')+'"><span>'+(i+1)+". "+s[0]+'</span><small>'+(st(tr,i).length>=5?'DONE':(unl(tr,i)?st(tr,i).length+'/5':'LOCKED'))+'</small></button>'}).join("");
  var n=Math.min(3,total());
  $("tk").textContent=n+"/3 DONE";
  document.querySelectorAll(".tk").forEach(function(b){b.onclick=function(){tr=b.dataset.k;sec=0;for(var i=0;i<TR[tr].s.length;i++){if(st(tr,i).length<5){sec=i;break}}render(true)}});
  document.querySelectorAll("#dd button").forEach(function(b){b.onclick=function(){sec=+b.dataset.i;$("dd").classList.remove("show");render(true)}});
}
function renderMap(anim){
  var m=$("qv"),W=m.clientWidth||340,lv=TR[tr].s[sec][1],a=st(tr,sec),H=TOP+5*GAP+190;
  m.style.height=H+"px";
  m.className="map"+(anim?"":" noanim");
  var pts=XS.map(function(x,i){return[W*x/100,TOP+i*GAP+48]});
  var svg='<svg class="path" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  for(var i=0;i<5;i++){
    var p=pts[i],q=pts[i+1],on=i<a.length,d="M"+p[0]+","+p[1]+" C"+p[0]+","+(p[1]+95)+" "+q[0]+","+(q[1]-95)+" "+q[0]+","+q[1];
    svg+='<g class="'+(on?'seg-on':'')+'"><path d="'+d+'" fill="none" stroke-linecap="round" stroke-width="30" style="stroke:'+(on?'rgba(var(--rgb),.3)':'rgba(215,226,234,.06)')+'"/><path d="'+d+'" fill="none" stroke-width="7" stroke-dasharray="14 16" style="stroke:'+(on?'var(--b1)':'rgba(215,226,234,.18)')+'"/></g>';
  }
  svg+='</svg>';
  var h='<div class="spark" style="left:2px">'+SPARK+'</div><div class="spark" style="right:2px;animation-delay:1.2s">'+SPARK+'</div><div class="moon"></div><div class="cube"></div>'+svg;
  lv.forEach(function(name,i){
    var s=lstate(i),n=a[i]||0,top=TOP+i*GAP,x=XS[i];
    var starsH="";for(var k=0;k<3;k++)starsH+=STAR.replace("FILL",k<n?"#FFD84D":"none").replace("STROKE",k<n?"#FFD84D":"#4a5568");
    h+='<div class="node'+(s==="lock"?' lock-n':'')+'" style="left:'+x+'%;top:'+top+'px;--d:'+(i*.08)+'s">'+
      (s==="cur"?'<div class="start"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>'+(tab==="t"?"READ":"START")+'</div>':'')+
      '<button class="box '+s+'" data-i="'+i+'" aria-label="Level '+(i+1)+'"><span class="code">&lt;/&gt;</span>'+(s==="lock"?LOCK:'<span class="num">'+(i+1)+'</span>')+'</button>'+
      '<div class="stars">'+starsH+'</div><div class="nm">'+name+'</div></div>';
  });
  var cleared=a.length>=5,op=claimed[key(tr,sec)];
  h+='<div class="node" style="left:'+XS[5]+'%;top:'+(TOP+5*GAP)+'px;--d:.5s"><div class="chest'+(op?' open':'')+'" id="chest"><svg width="120" viewBox="0 0 120 100"><ellipse cx="60" cy="92" rx="48" ry="7" fill="rgba(0,0,0,.55)"/><rect x="14" y="44" width="92" height="44" rx="8" fill="#1a1f2b" stroke="#4a5160" stroke-width="2"/><g class="lid"><path d="M14 46Q14 14 60 14Q106 14 106 46Z" fill="#232938" stroke="#646973" stroke-width="2"/></g><rect x="32" y="44" width="10" height="44" fill="#BBCCD7" opacity=".75"/><rect x="78" y="44" width="10" height="44" fill="#BBCCD7" opacity=".75"/><rect x="52" y="40" width="16" height="22" rx="4" fill="'+(cleared?'var(--b2)':'#646973')+'" stroke="#0C0C0C" stroke-width="2"/></svg></div><div class="nm">'+(op?'Claimed':(cleared?'Tap to open':'Reward'))+'</div></div>';
  m.innerHTML=h;
  m.querySelectorAll(".box").forEach(function(b){b.onclick=function(){play(+b.dataset.i,b)}});
  $("chest").onclick=function(){
    if(!cleared){toast("Clear all 5 levels to open");return}
    if(op){toast("Already claimed");return}
    claimed[key(tr,sec)]=1;toast("Chest opened · +50 XP");renderMap(false);
  };
}
function renderTheory(){
  var s=TR[tr].s[sec];
  $("tv").innerHTML='<h3 class="hg">'+s[0]+'</h3><div class="tcard">'+s[1].map(function(n,i){return '<div class="ti"><div class="n">'+(i+1)+'</div><div><h4>'+n+'</h4><p>'+(3+i)+' min read</p></div></div>'}).join("")+'</div>';
}
function play(i,b){
  var s=lstate(i);
  if(s==="lock"){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");toast(unl(tr,sec)?"Finish the previous level first":"Clear the previous section first");return}
  if(s==="done"){toast("Replaying "+TR[tr].s[sec][1][i]);return}
  var n=tab==="t"?3:1+Math.floor(Math.random()*3);
  st(tr,sec).push(n);
  toast(tab==="t"?"Lesson "+(i+1)+" read · ★★★":"Level "+(i+1)+" complete · "+"★".repeat(n)+"☆".repeat(3-n));
  if(st(tr,sec).length>=5)setTimeout(function(){toast("Section cleared · open the chest")},2100);
  renderHead();renderMap(false);
}
function render(anim){
  renderHead();
  $("qv").style.display="block";
  renderMap(anim);
}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});
  b.classList.add("on");tab=b.dataset.t;render(true)}});
$("chip").onclick=function(){$("dd").classList.toggle("show")};
$("nx").onclick=function(){sec=(sec+1)%TR[tr].s.length;$("dd").classList.remove("show");render(true)};
$("bk").onclick=function(){document.querySelector('.tab[data-t="t"]').click()};
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){renderMap(false)},150)});
render(true);
</script>
</body>
</html>
