<!DOCTYPE html>
<html lang="en" data-league="bronze">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0C0C0C;--fg:#D7E2EA;--b1:#4FA3FF;--b2:#1D6BFF;--b3:#0057E7;--s1:#646973;--s2:#BBCCD7;--card:#121418;--line:rgba(215,226,234,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

[data-league=bronze]{--b0:#1a0d04;--b1:#E0A064;--b2:#B8733A;--b3:#7a4520;--rgb:184,115,58;--bd:#B8733A;--t:#E0A064;--h1:#7a4a22;--h2:#E0A064;--on:#fff}
[data-league=silver]{--b0:#1b1e22;--b1:#EEF3F6;--b2:#AEB8C0;--b3:#5F6870;--rgb:187,204,215;--bd:#BBCCD7;--t:#D7E2EA;--h1:#646973;--h2:#EEF3F6;--on:#0C0C0C}
[data-league=gold]{--b0:#1c1400;--b1:#FFE27A;--b2:#F2B705;--b3:#9A6A00;--rgb:242,183,5;--bd:#F2B705;--t:#FFD84D;--h1:#9A6A00;--h2:#FFE27A;--on:#1a1200}
[data-league=crystal]{--b0:#12062b;--b1:#C9A2FF;--b2:#8E4DFF;--b3:#4A1C9A;--rgb:142,77,255;--bd:#8E4DFF;--t:#C9A2FF;--h1:#5b3aa8;--h2:#C9A2FF;--on:#fff}
[data-league=masters]{--b0:#000;--b1:#6B7280;--b2:#343942;--b3:#1c1f24;--rgb:160,168,180;--bd:#D7E2EA;--t:#C9D1D9;--h1:#4a4f57;--h2:#D7E2EA;--on:#fff}
[data-league=champion]{--b0:#1f0405;--b1:#FF7A7A;--b2:#E5322D;--b3:#7A0F10;--rgb:229,50,45;--bd:#E5322D;--t:#FF7A7A;--h1:#7A0F10;--h2:#FF7A7A;--on:#fff}
[data-league=emerald]{--b0:#02140c;--b1:#5CF2A8;--b2:#14C27A;--b3:#076B45;--rgb:20,194,122;--bd:#14C27A;--t:#5CF2A8;--h1:#076B45;--h2:#5CF2A8;--on:#06180f}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:'Kanit',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% -5%,rgba(var(--rgb),.3),transparent 55%) no-repeat,var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 130px}
.hg{background:linear-gradient(180deg,var(--h1) 0%,var(--h2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.025em}
.fade{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.25,.1,.25,1),transform .7s cubic-bezier(.25,.1,.25,1);transition-delay:var(--d,0s)}
.fade.in{opacity:1;transform:none}
h1{font-size:clamp(3rem,16vw,5rem);text-align:center;margin:14px 0 22px}
.tabs{display:flex;gap:6px;padding:6px;border:2px solid var(--bd);border-radius:999px}
.tab{flex:1;border:0;background:none;color:var(--fg);font:500 .85rem 'Kanit';letter-spacing:.1em;text-transform:uppercase;padding:12px;border-radius:999px;cursor:pointer;transition:background .2s,opacity .2s;opacity:.6}
.tab.on{opacity:1;color:var(--on);background:linear-gradient(123deg,var(--b0) 7%,var(--b3) 37%,var(--b2) 72%,var(--b1) 100%);box-shadow:0 4px 4px rgba(var(--rgb),.25),4px 4px 12px var(--b2) inset}
.league{margin-top:16px;border:2px solid var(--bd);border-radius:40px;padding:22px;background:var(--bg);position:relative;overflow:hidden}
.league::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(var(--rgb),.35),transparent 70%)}
.lrow{display:flex;gap:16px;align-items:center;position:relative}
.badge{width:78px;height:78px;flex:none;border-radius:22%;transform:rotate(12deg);background:linear-gradient(135deg,var(--b1),var(--b2) 60%,var(--b0));box-shadow:inset 6px 6px 14px rgba(255,255,255,.3),inset -8px -8px 16px rgba(0,0,0,.4),0 0 40px rgba(var(--rgb),.4);display:grid;place-items:center;font-weight:900;font-size:1.6rem;color:var(--on)}
.badge span{transform:rotate(-12deg)}
small.k{display:block;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;opacity:.6}
.lname{font-weight:800;text-transform:uppercase;font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.05;margin:2px 0}
.lmeta{font-size:.85rem;font-weight:300;letter-spacing:.05em;text-transform:uppercase}
.lmeta b{color:var(--t);font-weight:600}
.prog{margin-top:20px;position:relative}
.prog .top{display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;font-weight:300}
.bar{height:12px;border-radius:99px;background:rgba(215,226,234,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--b3),var(--b1));box-shadow:0 0 14px rgba(var(--rgb),.6);transition:width 1.2s cubic-bezier(.25,.1,.25,1) .5s}
.btn{display:block;width:100%;text-align:center;border-radius:999px;color:var(--on);font:500 .9rem 'Kanit';text-transform:uppercase;letter-spacing:.1em;padding:16px 32px;background:linear-gradient(123deg,var(--b0) 7%,var(--b3) 37%,var(--b2) 72%,var(--b1) 100%);box-shadow:0 4px 4px rgba(var(--rgb),.25),4px 4px 12px var(--b2) inset;outline:2px solid var(--on);outline-offset:-3px;cursor:pointer;border:0;margin-top:16px;transition:transform .2s}
.btn:active{transform:scale(.97)}
.seg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 8px;flex-wrap:wrap}
.pills{display:flex;gap:4px;padding:4px;border:2px solid var(--bd);border-radius:999px}
.pill{border:0;background:none;color:var(--fg);font:500 .72rem 'Kanit';letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer;opacity:.6}
.pill.on{background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--on);opacity:1}
.note{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.6;font-weight:300}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:18px 0 22px}
.pc{border:2px solid var(--line);border-radius:28px;padding:16px 8px 14px;text-align:center;background:var(--card);position:relative}
.pc.p1{border-color:var(--bd);padding-top:26px;padding-bottom:20px;background:linear-gradient(180deg,rgba(var(--rgb),.25),var(--card) 70%);box-shadow:0 0 60px rgba(var(--rgb),.25)}
.medal{width:46px;height:46px;margin:0 auto 10px;border-radius:30%;display:grid;place-items:center;font-weight:900;font-size:1.3rem;color:#0C0C0C;box-shadow:inset 4px 4px 8px rgba(255,255,255,.5),inset -4px -4px 8px rgba(0,0,0,.3)}
.p1 .medal{width:60px;height:60px;font-size:1.7rem;color:var(--on);background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:inset 5px 5px 10px rgba(255,255,255,.4),inset -6px -6px 12px rgba(0,0,0,.3),0 0 30px rgba(var(--rgb),.5)}
.p2 .medal{background:linear-gradient(135deg,var(--s2),var(--s1))}
.p3 .medal{background:linear-gradient(135deg,var(--b2),var(--b3));color:var(--on)}
.tag{display:inline-block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:3px 9px;margin-bottom:8px;opacity:.8}
.pname{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.pscore{display:inline-block;margin-top:8px;font-weight:800;font-size:1.05rem;padding:4px 14px;border-radius:99px;background:rgba(215,226,234,.08)}
.p1 .pscore{background:linear-gradient(123deg,var(--b3),var(--b1));color:var(--on)}
.zone{border:2px solid var(--bd);border-radius:32px;overflow:hidden;background:var(--bg)}
.zh{padding:14px 20px;text-align:center;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--t);background:rgba(var(--rgb),.12);border-bottom:1px solid var(--line)}
.zh.dn{color:var(--s2);background:rgba(215,226,234,.05);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(14px);animation:up .5s cubic-bezier(.25,.1,.25,1) forwards;animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none}}
.rank{width:42px;height:42px;flex:none;border-radius:30%;display:grid;place-items:center;font-weight:800;font-size:.85rem;border:1px solid var(--line);background:var(--card)}
.rank.r1{background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--on);border:0}
.rank.r2{background:linear-gradient(135deg,var(--s2),var(--s1));color:#0C0C0C;border:0}
.rank.r3{background:linear-gradient(135deg,var(--b2),var(--b3));color:var(--on);border:0}
.nm{flex:1;min-width:0;font-weight:500;font-size:1.05rem;display:flex;align-items:center;gap:8px;overflow:hidden}
.nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{font-size:.68rem;font-weight:600;color:var(--t);border:1px solid rgba(var(--rgb),.45);background:rgba(var(--rgb),.14);border-radius:8px;padding:2px 7px;flex:none}
.sc{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.sc em{font-style:normal;width:14px;height:14px;border-radius:30%;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:inset 2px 2px 4px rgba(255,255,255,.4),0 0 8px rgba(var(--rgb),.5)}
.row.me{background:linear-gradient(90deg,rgba(var(--rgb),.25),rgba(var(--rgb),.04));border-bottom:0}
.row.me .nm{font-weight:700}
.you{font-size:.62rem;letter-spacing:.12em;border:1px solid var(--t);border-radius:99px;padding:2px 9px;font-weight:600}
.lg{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;scrollbar-width:none}
.lg::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:500 .78rem 'Kanit';letter-spacing:.08em;text-transform:uppercase;padding:7px 14px 7px 8px;border-radius:999px;cursor:pointer;opacity:.65;transition:opacity .2s,border-color .2s,transform .2s}
.chip:active{transform:scale(.96)}
.chip.on{opacity:1;border-color:var(--bd);background:rgba(var(--rgb),.15)}
.gem{width:26px;height:26px;border-radius:30%;transform:rotate(12deg);background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:inset 2px 2px 5px rgba(255,255,255,.4),inset -3px -3px 6px rgba(0,0,0,.35)}
.chip small{font-size:.55rem;letter-spacing:.1em;border:1px solid currentColor;border-radius:99px;padding:1px 6px;opacity:.8}
.clan{display:none}
.clan.show{display:block}
.csec{background:#fff;color:#0C0C0C;border-radius:32px;margin-top:16px;padding:8px 22px}
.ci{display:flex;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid rgba(12,12,12,.15)}
.ci:last-child{border:0}
.ci .n{font-weight:900;font-size:2.8rem;line-height:1;min-width:1.2em}
.ci h3{font-weight:500;text-transform:uppercase;font-size:1.1rem}
.ci p{font-weight:300;font-size:.85rem;opacity:.6}
.ci b{margin-left:auto;font-weight:800;font-size:1.2rem}
.dock{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 40%);z-index:20}
.dock .btn{max-width:528px;margin:0 auto}
@media(prefers-reduced-motion:reduce){.fade,.row,.bar i{transition:none;animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="hg fade">Leaderboard</h1>
  <div class="tabs fade" style="--d:.1s">
    <button class="tab on" data-t="lb">Leaderboard</button>
    <button class="tab" data-t="cl">Clan</button>
  </div>

  <div class="lg fade" id="lg" style="--d:.15s"></div>
  <div id="lb">
    <div class="league fade" style="--d:.2s">
      <div class="lrow">
        <div class="badge"><span id="tier">III</span></div>
        <div>
          <small class="k" id="lk">Clash League · 3d left</small>
          <div class="lname" id="ln">Bronze League III</div>
          <div class="lmeta"><b>0</b> trophies · <span id="xp">+0%</span> XP bonus</div>
        </div>
      </div>
      <div class="prog">
        <div class="top"><span id="pl">Promotion to Bronze League II</span><span id="pg">500 to go</span></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </div>
    <button class="btn fade" style="--d:.3s">Play to Increase Trophies</button>

    <div class="seg fade" style="--d:.35s">
      <div class="pills">
        <button class="pill on" data-s="div">My Division</button>
        <button class="pill" data-s="glob">Top Global</button>
      </div>
      <span class="note">Top 10 promote</span>
    </div>

    <div class="podium" id="podium"></div>
    <div class="zone fade" style="--d:.2s">
      <div class="zh" id="zh">Promotion zone · top 10 advance</div>
      <div id="rows"></div>
    </div>
  </div>

  <div id="cl" class="clan">
    <div class="league fade in" style="margin-top:16px">
      <small class="k">Your clan</small>
      <div class="lname">Pixel Wolves</div>
      <div class="lmeta"><b>12</b> members · 4,820 trophies</div>
    </div>
    <div class="csec" id="clans"></div>
  </div>
</div>

<div class="dock"><button class="btn" style="margin:0 auto;max-width:528px">Practice DSA</button></div>

<script>
var LG=[
["bronze","Bronze","#E0A064","#7a4520",0,"+0%",370],
["silver","Silver","#EEF3F6","#5F6870",500,"+5%",880],
["gold","Gold","#FFE27A","#9A6A00",1000,"+10%",1620],
["crystal","Crystal","#C9A2FF","#4A1C9A",2000,"+15%",2900],
["masters","Masters","#6B7280","#000000",3500,"+20%",4700],
["champion","Champion","#FF7A7A","#7A0F10",5500,"+30%",7000],
["emerald","Emerald","#5CF2A8","#076B45",8000,"+50%",9800]];
var NAMES=["CipherByte","ApexCoder","KaggleHero","SyntaxSlayer","DeepThinker","TensorFlow_99","RustEnthusiast","PromptWhisperer","AlgoWizard","ZeroDayNinja","QuantumLeap","NullPointer","ByteBaron","StackSage","RecursionKing","HeapHero","GraphGuru","BitBender","LambdaLord","CacheCat"];
var F=[1,.9,.83,.77,.7,.67,.53,.47,.43,.34],UP={4:7,5:8,8:8};
var GLOB=[["QuantumLeap",12120],["NullPointer",11988],["ByteBaron",11871,5],["StackSage",11640],["RecursionKing",11512,3],["HeapHero",11390],["GraphGuru",11255],["BitBender",11101,9],["LambdaLord",10990],["CacheCat",10874]];
var CUR=0,sel=0,mode="div";
var CLANS=[["Pixel Wolves","12 members",4820],["Null Pointers","30 members",4410],["Stack Overflowers","24 members",3975],["Byte Brigade","18 members",3120]];
function board(i){return F.map(function(f,k){return [NAMES[(k+i*3)%20],Math.round(LG[i][6]*f),UP[k]]})}
function podium(d){
  var o=[1,0,2],cls=["p2","p1","p3"],tag=["2nd place","Champion","3rd place"];
  document.getElementById("podium").innerHTML=o.map(function(i,k){var p=d[i];return '<div class="pc '+cls[k]+' fade" style="--d:'+(.05+k*.1)+'s"><div class="medal">'+(i+1)+'</div><span class="tag">'+tag[k]+'</span><div class="pname">'+p[0]+'</div><span class="pscore">'+p[1]+'</span></div>'}).join("");
}
function rows(d,me){
  var h=d.map(function(p,i){
    var r=i<3?" r"+(i+1):"";
    return '<div class="row" style="--d:'+(i*.05)+'s"><div class="rank'+r+'">'+(i<3?i+1:"#"+(i+1))+'</div><div class="nm"><span class="t">'+p[0]+'</span>'+(p[2]?'<span class="up">↗ +'+p[2]+'</span>':'')+'</div><div class="sc"><em></em>'+p[1]+'</div></div>';
  }).join("");
  if(me)h+='<div class="row me" style="--d:.55s"><div class="rank">#11</div><div class="nm"><span class="t">You</span><span class="you">YOU</span></div><div class="sc"><em></em>0</div></div>';
  document.getElementById("rows").innerHTML=h;
}
function chips(){
  document.getElementById("lg").innerHTML=LG.map(function(l,i){
    return '<button class="chip'+(i===sel?' on':'')+'" data-i="'+i+'"><span class="gem" style="--c1:'+l[2]+';--c2:'+l[3]+'"></span>'+l[1]+(i===CUR?'<small>You</small>':'')+'</button>';
  }).join("");
  document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){sel=+b.dataset.i;render(true)}});
  var on=document.querySelector(".chip.on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
function render(sw){
  var l=LG[sel],cur=sel===CUR,locked=sel>CUR;
  document.documentElement.dataset.league=l[0];
  document.getElementById("tier").textContent=cur?"III":"I";
  document.getElementById("ln").textContent=l[1]+" League "+(cur?"III":"I");
  document.getElementById("xp").textContent=l[5];
  document.getElementById("lk").textContent=cur?"Clash League · 3d left":(locked?"Locked · preview":"Completed");
  document.getElementById("pl").textContent=cur?"Promotion to Bronze League II":(locked?"Unlock "+l[1]+" League":"League cleared");
  document.getElementById("pg").textContent=cur?"500 to go":(locked?l[4]+" to go":"Done");
  var bar=document.getElementById("bar");bar.style.width="0";
  setTimeout(function(){bar.style.width=cur?"4%":(locked?"0":"100%")},100);
  var d=mode==="div"?board(sel):GLOB;
  podium(d);rows(d,cur&&mode==="div");
  document.getElementById("zh").textContent=mode==="glob"?"Global elite · season rankings":(locked?"Preview · reach "+l[4]+" trophies to join":"Promotion zone · top 10 advance");
  chips();
  requestAnimationFrame(function(){document.querySelectorAll("#podium .fade").forEach(function(e){setTimeout(function(){e.classList.add("in")},30)})});
}
document.querySelectorAll(".pill").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".pill").forEach(function(x){x.classList.remove("on")});
  b.classList.add("on");mode=b.dataset.s;render();}});
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});
  b.classList.add("on");
  document.getElementById("lb").style.display=b.dataset.t==="lb"?"block":"none";
  document.getElementById("cl").classList.toggle("show",b.dataset.t==="cl");}});
document.getElementById("clans").innerHTML=CLANS.map(function(c,i){return '<div class="ci"><div class="n">'+(i+1)+'</div><div><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div><b>'+c[2]+'</b></div>'}).join("");
render();
document.querySelectorAll(".fade").forEach(function(e){setTimeout(function(){e.classList.add("in")},60)});
</script>
</body>
</html>
