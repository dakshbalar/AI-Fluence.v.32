<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholar Store</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--fg:#D7E2EA;--b2:#4FA3FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0C0C0C;color:var(--fg);font-family:'Kanit',sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 60px;overflow-x:clip}
button{font-family:inherit;color:inherit;cursor:pointer}
.hh{background:linear-gradient(180deg,#646973,#BBCCD7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.025em}
.i{display:inline-block;flex:none}.i svg{width:100%;height:100%;display:block}
.bar{display:flex;gap:8px;position:sticky;top:0;z-index:20;background:rgba(12,12,12,.92);backdrop-filter:blur(8px);padding:10px 0;padding-top:max(10px,env(safe-area-inset-top,0px));margin-top:calc(-1*env(safe-area-inset-top,0px))}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid rgba(215,226,234,.35);border-radius:999px;padding:6px 8px;font-weight:700;background:#111418;font-size:.95rem}
.pill.g{border-color:#1D6BFF;color:var(--b2)}
h1{font-size:clamp(3rem,15vw,5rem);margin:18px 0 4px}
.sub{font-weight:300;text-transform:uppercase;letter-spacing:.15em;font-size:.8rem;opacity:.7}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:2px solid rgba(215,226,234,.35);border-radius:999px;padding:5px;margin:20px 0 14px}
.tabs button{border:0;background:none;border-radius:999px;padding:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem}
.tabs button.on{background:linear-gradient(123deg,#010B1F 7%,#0057E7 37%,#1D6BFF 72%,#4FA3FF 100%);box-shadow:4px 4px 12px #2170F1 inset;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;border:2px solid rgba(215,226,234,.35);background:none;border-radius:999px;padding:7px 16px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem}
.chip.on{background:#D7E2EA;color:#0C0C0C;border-color:#D7E2EA}
.boost{display:none;align-items:center;gap:10px;border:2px solid #1D6BFF;background:#06142e;border-radius:28px;padding:10px 16px;margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
.boost.on{display:flex}.boost b{margin-left:auto;color:var(--b2);font-variant-numeric:tabular-nums}
.feat{border:2px solid #4FA3FF;border-radius:40px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;background:radial-gradient(circle at 20% 30%,#0a2a66,#06090f);box-shadow:0 0 40px rgba(29,107,255,.25)}
.feat small{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--b2);font-weight:600}
.feat h3{font-weight:800;text-transform:uppercase;font-size:1.3rem;line-height:1.1;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{grid-column:1/-1;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.9rem;opacity:.8;margin-top:10px}
.card{border:2px solid rgba(215,226,234,.4);border-radius:32px;padding:14px;background:#0f1216;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;cursor:pointer}
.card .art{width:100%;aspect-ratio:1.2;display:grid;place-items:center;border-radius:22px;background:radial-gradient(circle at 50% 40%,#0a1a3d,#06090f)}
.card b{font-weight:600;text-transform:uppercase;font-size:.85rem;letter-spacing:.03em;line-height:1.2}
.card small{font-weight:300;opacity:.65;font-size:.72rem;line-height:1.35;min-height:2.7em}
.own{position:absolute;top:10px;right:10px;background:#1D6BFF;border-radius:999px;font-size:.72rem;font-weight:700;padding:2px 9px;color:#fff}
.price{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:1rem;color:#fff;border-radius:999px;padding:8px 16px;width:100%;border:0;background:linear-gradient(123deg,#010B1F 7%,#0057E7 37%,#1D6BFF 72%,#4FA3FF 100%);box-shadow:0 4px 4px rgba(1,87,231,.25),4px 4px 12px #2170F1 inset;outline:2px solid #fff;outline-offset:-3px}
.price.use{background:none;box-shadow:none;outline:0;border:2px solid #D7E2EA;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
.empty{grid-column:1/-1;text-align:center;border:2px solid rgba(215,226,234,.4);border-radius:40px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h4{font-size:1.4rem;text-transform:uppercase;font-weight:700}.empty p{font-weight:300;opacity:.8;line-height:1.6;font-size:.95rem}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none}.bd.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:60;background:#fff;color:#0C0C0C;border-radius:40px 40px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.25,.1,.25,1);text-align:center}
.sheet.on{transform:none}
.sheet .art{width:150px;height:150px;margin:0 auto 6px;border-radius:32px;display:grid;place-items:center;background:radial-gradient(circle,#0a1a3d,#06090f)}
.sheet h3{font-weight:900;text-transform:uppercase;font-size:1.6rem}.sheet p{font-weight:300;line-height:1.5;margin:6px 0 14px;opacity:.75}
.qty{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:14px}
.qty button{width:44px;height:44px;border-radius:50%;border:2px solid #0C0C0C;background:none;font-size:1.4rem;font-weight:700}
.qty b{font-size:1.6rem;min-width:2ch}
.tot{display:flex;justify-content:center;gap:8px;align-items:center;font-weight:700;margin-bottom:14px;font-size:1.1rem}
.sheet .go{width:100%;border:0;border-radius:999px;padding:15px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#fff;background:linear-gradient(123deg,#010B1F 7%,#0057E7 37%,#1D6BFF 72%,#4FA3FF 100%);box-shadow:4px 4px 12px #2170F1 inset}
.sheet .go:disabled{opacity:.4}.sheet .no{color:#c0182b;font-weight:600;font-size:.85rem;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#D7E2EA;color:#0C0C0C;font-weight:600;border-radius:999px;padding:10px 22px;opacity:0;transition:.3s;z-index:80;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;text-align:center;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(2,5,12,.94);transition:background .5s;overflow:hidden}
#fx.on{display:flex}#fx.out{background:rgba(2,5,12,0)}
#stg{position:relative;width:min(78vw,320px);height:min(78vw,320px);display:grid;place-items:center}
.abs{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.big{position:relative}.big svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 22px rgba(125,190,255,.55))}
.rays{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;margin:-95% 0 0 -95%;border-radius:50%;background:repeating-conic-gradient(var(--c) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 4%,transparent 62%);mask:radial-gradient(circle,#000 4%,transparent 62%);opacity:0;animation:spin 8s linear infinite}
.glow{position:absolute;left:50%;top:50%;width:130%;aspect-ratio:1;margin:-65% 0 0 -65%;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 65%);opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes hue{to{filter:hue-rotate(360deg)}}
.cap{margin-top:22px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;text-align:center;min-height:1.6em;font-size:1rem;transition:opacity .3s}
.cards{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(94vw,420px)}
.rc{width:104px;border:2px solid var(--c);border-radius:24px;background:linear-gradient(160deg,#0a1a3d,#06090f);padding:12px 6px;text-align:center;box-shadow:0 0 28px var(--c);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.rc b{font-weight:800;font-size:.78rem;text-transform:uppercase;margin-top:6px;line-height:1.15}
.rc::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shn 1.5s .7s infinite}
@keyframes shn{to{transform:translateX(120%)}}
.fl{position:fixed;left:0;top:0;z-index:100;pointer-events:none;will-change:transform}.fl svg{width:100%;height:100%;display:block}
.bump{animation:bmp .35s}@keyframes bmp{50%{transform:scale(1.22);box-shadow:0 0 24px #4FA3FF}}
.ring{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;margin:-15% 0 0 -15%;border-radius:50%;border:4px solid var(--c);opacity:0;pointer-events:none}
.dome{position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;margin:-30% 0 0 -30%;border-radius:50%;border:3px solid #9CD0FF;background:radial-gradient(circle,rgba(79,163,255,.3),transparent 70%);opacity:0;pointer-events:none}
.dot{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none}.dot svg{width:100%;height:100%;display:block}
.shard{position:absolute;left:50%;top:50%;width:38px;height:38px;pointer-events:none}
.flash{position:absolute;inset:-60vh -60vw;background:#fff;opacity:0;pointer-events:none;z-index:2}
</style></head><body><main>
<div class="bar" id="bar"></div>
<h1 class="hh">Store</h1><p class="sub" id="who"></p>
<div class="tabs"><button id="t1" class="on">Store</button><button id="t2">Inventory</button></div>
<div class="boost" id="bst"><span class="i" style="width:28px;height:28px" id="bic"></span>2× XP Boost active<b id="btm"></b></div>
<div class="chips" id="chips"></div>
<div class="grid" id="view"></div>
</main>
<div class="bd" id="bd"></div><div class="sheet" id="sh"></div><div class="toast" id="ts"></div><div id="fx"><div id="stg"></div><div class="cap" id="cap"></div></div>
