<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
    
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#070913" />
        <stop offset="40%" stop-color="#0b1122" />
        <stop offset="80%" stop-color="#090d1a" />
        <stop offset="100%" stop-color="#050811" />
      </linearGradient>
      
      <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="50%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#8b5cf6" />
      </linearGradient>

      <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#3b82f6" />
      </linearGradient>

      <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8b5cf6" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>

      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fbbf24" />
      </linearGradient>

      <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.5" fill="#38bdf8" fill-opacity="0.12" />
      </pattern>

      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="25" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    

    <!-- Background Canvas -->
    <rect width="1080" height="1920" fill="url(#bgGrad)" />
    <rect width="1080" height="1920" fill="url(#dotGrid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="200" cy="350" r="300" fill="#f59e0b" fill-opacity="0.22" filter="url(#glow)" />
    <circle cx="850" cy="1100" r="350" fill="#ef4444" fill-opacity="0.18" filter="url(#glow)" />

    <!-- Isometric Grid Floor at bottom -->
    <g opacity="0.2" stroke="#f59e0b" stroke-width="1.2">
      <line x1="0" y1="1740" x2="1080" y2="1740" />
      <line x1="0" y1="1820" x2="1080" y2="1820" />
      <line x1="0" y1="1900" x2="1080" y2="1900" />
      <line x1="200" y1="1700" x2="0" y2="1920" />
      <line x1="540" y1="1700" x2="540" y2="1920" />
      <line x1="880" y1="1700" x2="1080" y2="1920" />
    </g>

    <!-- Top Status Bar (y=60) -->
    <g transform="translate(60, 60)">
      <rect width="960" height="84" rx="24" fill="#0c1224" fill-opacity="0.9" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
      
      <rect x="20" y="16" width="52" height="52" rx="16" fill="#f59e0b" />
      <text x="46" y="52" font-size="28" text-anchor="middle">💻</text>
      
      <text x="88" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="1">A.I. FLUENCE</text>
      <text x="88" y="68" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="2">FEATURE 5 / 15</text>

      <g transform="translate(680, 20)">
        <rect width="240" height="44" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2" />
        <text x="120" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">LIVE RUNTIME</text>
      </g>
    </g>

    <!-- Headline & Narrative (y=180 to 420) -->
    <g transform="translate(60, 180)">
      <rect width="180" height="34" rx="10" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1" />
      <text x="90" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">FEATURE #5</text>

      <text x="0" y="100" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">Practice</text>
      <text x="0" y="155" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">Learn by Doing</text>

      <text x="0" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="22">In-browser compiler with sub-second execution</text>
    </g>

    <!-- Main Central HD Mockup Canvas (y=430 to 1180) -->
    <g transform="translate(100, 430)">
      
        <rect width="880" height="720" rx="28" fill="#090d1a" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" />
        <rect x="0" y="0" width="880" height="56" rx="28 28 0 0" fill="#0c1322" />
        <circle cx="30" cy="28" r="7" fill="#ef4444" />
        <circle cx="52" cy="28" r="7" fill="#f59e0b" />
        <circle cx="74" cy="28" r="7" fill="#10b981" />
        <text x="110" y="34" fill="#94a3b8" font-family="monospace" font-size="15">solution_optimized.py — 0ms Latency</text>
        
        <g transform="translate(40, 95)" font-family="monospace" font-size="17">
          <text x="0" y="30" fill="#ef4444">def</text><text x="45" y="30" fill="#60a5fa"> find_max_path_sum</text><text x="240" y="30" fill="#fff">(root: TreeNode) -&gt; int:</text>
          <text x="30" y="75" fill="#94a3b8"># Compute maximum path sum in O(N)</text>
          <text x="30" y="120" fill="#fff">max_sum = float('-inf')</text>
          <text x="30" y="165" fill="#ef4444">def</text><text x="75" y="165" fill="#60a5fa"> dfs</text><text x="115" y="165" fill="#fff">(node):</text>
          <text x="60" y="210" fill="#ef4444">if not</text><text x="140" y="210" fill="#fff"> node: </text><text x="215" y="210" fill="#ef4444">return</text><text x="290" y="210" fill="#facc15"> 0</text>
          <text x="60" y="255" fill="#fff">left = max(0, dfs(node.left))</text>
          <text x="60" y="300" fill="#fff">right = max(0, dfs(node.right))</text>
          <text x="60" y="345" fill="#fff">max_sum = max(max_sum, left + right + node.val)</text>
          <text x="60" y="390" fill="#ef4444">return</text><text x="135" y="390" fill="#fff"> node.val + max(left, right)</text>
        </g>
        <rect x="40" y="520" width="800" height="160" rx="16" fill="#04060c" stroke="#f59e0b" stroke-width="1.5" />
        <g transform="translate(60, 560)" font-family="monospace">
          <text x="0" y="0" fill="#10b981" font-size="18" font-weight="bold">✓ 15/15 Test Cases Passed! (Runtime: 4ms)</text>
          <text x="0" y="35" fill="#94a3b8" font-size="15">Memory Usage: 16.4 MB (Beats 98.2% of submissions)</text>
          <text x="0" y="70" fill="#f59e0b" font-size="15">Complexity: O(N) Time • O(H) Space [PASSED]</text>
        </g>
        
    </g>

    <!-- Feature Capabilities Bullet List (y=1200 to 1480) -->
    <g transform="translate(100, 1200)">
      <rect width="880" height="260" rx="28" fill="#0c1222" fill-opacity="0.9" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
      <g transform="translate(40, 40)">
        
        <g transform="translate(0, 0)">
          <circle cx="20" cy="20" r="14" fill="#f59e0b" fill-opacity="0.2" />
          <circle cx="20" cy="20" r="6" fill="#f59e0b" />
          <text x="50" y="27" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="20">Zero-configuration browser execution environment</text>
        </g>
        
        <g transform="translate(0, 70)">
          <circle cx="20" cy="20" r="14" fill="#f59e0b" fill-opacity="0.2" />
          <circle cx="20" cy="20" r="6" fill="#f59e0b" />
          <text x="50" y="27" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="20">Instant test-suite feedback on every key stroke</text>
        </g>
        
        <g transform="translate(0, 140)">
          <circle cx="20" cy="20" r="14" fill="#f59e0b" fill-opacity="0.2" />
          <circle cx="20" cy="20" r="6" fill="#f59e0b" />
          <text x="50" y="27" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="20">Preloaded test benches for Python, C++, JS, and SQL</text>
        </g>
        
      </g>
    </g>

    <!-- Bottom Metric Banner & Call to Action (y=1500 to 1830) -->
    <g transform="translate(100, 1500)">
      <rect width="880" height="290" rx="32" fill="url(#heroGrad)" />
      
      <g transform="translate(50, 45)">
        <text x="0" y="30" fill="#e0e7ff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" letter-spacing="2">TEST CASES PASSED</text>
        <text x="0" y="90" fill="#ffffff" font-family="monospace" font-weight="900" font-size="52">12 / 12 (100%)</text>
        <text x="0" y="135" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="20">Fully synchronized in real time with cloud persistence.</text>

        <!-- CTA pill -->
        <rect x="0" y="170" width="300" height="54" rx="18" fill="#ffffff" />
        <text x="150" y="204" fill="#1e1b4b" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">LAUNCH THIS FEATURE ➔</text>
      </g>
    </g>

</svg>