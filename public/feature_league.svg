<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
    
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#070913" />
        <stop offset="40%" stop-color="#0b1122" />
        <stop offset="80%" stop-color="#090d1a" />
        <stop offset="100%" stop-color="#050811" />
      </linearGradient>
      
      <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="50%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#8b5cf6" />
      </linearGradient>

      <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#3b82f6" />
      </linearGradient>

      <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8b5cf6" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>

      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fbbf24" />
      </linearGradient>

      <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.5" fill="#38bdf8" fill-opacity="0.12" />
      </pattern>

      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="25" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    

    <!-- Background Canvas -->
    <rect width="1080" height="1920" fill="url(#bgGrad)" />
    <rect width="1080" height="1920" fill="url(#dotGrid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="200" cy="350" r="300" fill="#f59e0b" fill-opacity="0.22" filter="url(#glow)" />
    <circle cx="850" cy="1100" r="350" fill="#8b5cf6" fill-opacity="0.18" filter="url(#glow)" />

    <!-- Isometric Grid Floor at bottom -->
    <g opacity="0.2" stroke="#f59e0b" stroke-width="1.2">
      <line x1="0" y1="1740" x2="1080" y2="1740" />
      <line x1="0" y1="1820" x2="1080" y2="1820" />
      <line x1="0" y1="1900" x2="1080" y2="1900" />
      <line x1="200" y1="1700" x2="0" y2="1920" />
      <line x1="540" y1="1700" x2="540" y2="1920" />
      <line x1="880" y1="1700" x2="1080" y2="1920" />
    </g>

    <!-- Top Status Bar (y=60) -->
    <g transform="translate(60, 60)">
      <rect width="960" height="84" rx="24" fill="#0c1224" fill-opacity="0.9" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
      
      <rect x="20" y="16" width="52" height="52" rx="16" fill="#f59e0b" />
      <text x="46" y="52" font-size="28" text-anchor="middle">🏆</text>
      
      <text x="88" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="1">A.I. FLUENCE</text>
      <text x="88" y="68" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="2">FEATURE 12 / 15</text>

      <g transform="translate(680, 20)">
        <rect width="240" height="44" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2" />
        <text x="120" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">RANKED LADDER</text>
      </g>
    </g>

    <!-- Headline & Narrative (y=180 to 420) -->
    <g transform="translate(60, 180)">
      <rect width="180" height="34" rx="10" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1" />
      <text x="90" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">FEATURE #12</text>

      <text x="0" y="100" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">League</text>
      <text x="0" y="155" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">Compete. Climb Higher.</text>

      <text x="0" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="22">Weekly promotion races across competitive tiers</text>
    </g>

    <!-- Main Central HD Mockup Canvas (y=430 to 1180) -->
    <g transform="translate(100, 430)">
      
        <rect width="880" height="720" rx="28" fill="#090d1a" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" />
        <rect x="40" y="40" width="800" height="280" rx="22" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
        <text x="70" y="90" font-size="44">🏆</text>
        <text x="140" y="85" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">RANKED LADDER</text>
        <text x="140" y="115" fill="#f59e0b" font-family="sans-serif" font-size="16">Weekly promotion races across competitive tiers</text>
        <line x1="70" y1="145" x2="780" y2="145" stroke="rgba(255,255,255,0.08)" />
        <text x="70" y="195" fill="#94a3b8" font-family="sans-serif" font-size="17">Real-time telemetry, gamified progress counters, and high-adrenaline coding.</text>
        <text x="70" y="240" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="16">STATUS: FULLY OPERATIONAL IN VERSION 2.0</text>
        
        <g transform="translate(40, 360)">
          <rect width="380" height="310" rx="22" fill="#0c1222" stroke="#f59e0b" stroke-width="1.5" />
          <text x="35" y="55" fill="#94a3b8" font-family="sans-serif" font-size="15">PRIMARY METRIC</text>
          <text x="35" y="115" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="44">CHAMPION III</text>
          <text x="35" y="160" fill="#f59e0b" font-family="sans-serif" font-size="15">CURRENT DIVISION</text>
          <rect x="35" y="200" width="310" height="60" rx="14" fill="#f59e0b" fill-opacity="0.15" />
          <text x="190" y="238" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">ACTIVE TELEMETRY</text>
        </g>
        
        <g transform="translate(460, 360)">
          <rect width="380" height="310" rx="22" fill="#0c1222" stroke="#8b5cf6" stroke-width="1.5" />
          <text x="35" y="55" fill="#94a3b8" font-family="sans-serif" font-size="15">LEAGUE STANDING</text>
          <text x="35" y="115" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="44">TOP 1.4%</text>
          <text x="35" y="160" fill="#8b5cf6" font-family="sans-serif" font-size="15">GLOBAL LEADERBOARD</text>
          <rect x="35" y="200" width="310" height="60" rx="14" fill="#8b5cf6" fill-opacity="0.15" />
          <text x="190" y="238" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">CHAMPION DIVISION</text>
        </g>
        
    </g>

    <!-- Feature Capabilities Bullet List (y=1200 to 1480) -->
    <g transform="translate(100, 1200)">
      <rect width="880" height="260" rx="28" fill="#0c1222" fill-opacity="0.9" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
      <g transform="translate(40, 40)">
        
        <g transform="translate(0, 0)">
          <circle cx="20" cy="20" r="14" fill="#f59e0b" fill-opacity="0.2" />
          <circle cx="20" cy="20" r="6" fill="#f59e0b" />
          <text x="50" y="27" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="20">Promotion &amp; demotion zones with weekly cutoff timers</text>
        </g>
        
        <g transform="translate(0, 70)">
          <circle cx="20" cy="20" r="14" fill="#f59e0b" fill-opacity="0.2" />
          <circle cx="20" cy="20" r="6" fill="#f59e0b" />
          <text x="50" y="27" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="20">Climb through Gold, Crystal, Master, Champion and Legend</text>
        </g>
        
        <g transform="translate(0, 140)">
          <circle cx="20" cy="20" r="14" fill="#f59e0b" fill-opacity="0.2" />
          <circle cx="20" cy="20" r="6" fill="#f59e0b" />
          <text x="50" y="27" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="600" font-size="20">Earn seasonal badge emblems and permanent credentials</text>
        </g>
        
      </g>
    </g>

    <!-- Bottom Metric Banner & Call to Action (y=1500 to 1830) -->
    <g transform="translate(100, 1500)">
      <rect width="880" height="290" rx="32" fill="url(#heroGrad)" />
      
      <g transform="translate(50, 45)">
        <text x="0" y="30" fill="#e0e7ff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" letter-spacing="2">CURRENT DIVISION</text>
        <text x="0" y="90" fill="#ffffff" font-family="monospace" font-weight="900" font-size="52">CHAMPION III</text>
        <text x="0" y="135" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="20">Fully synchronized in real time with cloud persistence.</text>

        <!-- CTA pill -->
        <rect x="0" y="170" width="300" height="54" rx="18" fill="#ffffff" />
        <text x="150" y="204" fill="#1e1b4b" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">LAUNCH THIS FEATURE ➔</text>
      </g>
    </g>

</svg>